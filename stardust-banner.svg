<svg width="840" height="300" viewBox="0 0 840 300"
     xmlns="http://www.w3.org/2000/svg">
  <title>Nur Amirah Mohd Kamil (Mia) — AI Systems Engineer · Vibe Coder</title>
  <defs>
    <radialGradient id="nebula" cx="0.28" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#E9C46A" stop-opacity="0.07"/>
      <stop offset="0.55" stop-color="#C9932F" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#0A0908" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rigelGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A6C8FF" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#A6C8FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#A6C8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0D48A" stop-opacity="0"/>
      <stop offset="1" stop-color="#F0D48A" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .mono  { font-family:'Courier New',Courier,monospace; }
      .serif { font-family:Georgia,'Times New Roman',serif; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      .tw1 { animation: tw 3.4s ease-in-out infinite; }
      .tw2 { animation: tw 4.6s ease-in-out infinite 1.1s; }
      .tw3 { animation: tw 5.5s ease-in-out infinite 2.2s; }
      .drift  { animation: drift 16s ease-in-out infinite alternate; }
      .drift2 { animation: drift 20s ease-in-out infinite alternate-reverse; }
      .shoot  { animation: shoot 9s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
      @keyframes tw    { 0%,100% { opacity:.95; } 50% { opacity:.3; } }
      @keyframes drift { from { transform:translate(0,0); } to { transform:translate(8px,-5px); } }
      @keyframes shoot {
        0%   { transform:translate(-140px,-10px); opacity:0; }
        3%   { opacity:.9; }
        13%  { transform:translate(980px,85px); opacity:0; }
        100% { transform:translate(980px,85px); opacity:0; }
      }
    </style>
  </defs>

  <!-- warm deep space -->
  <rect width="840" height="300" rx="14" fill="#0A0908"/>
  <rect x="1.5" y="1.5" width="837" height="297" rx="13" fill="none" stroke="#2A2117" stroke-width="1.5"/>
  <rect width="840" height="300" rx="14" fill="url(#nebula)"/>

  <!-- drifting gold dust -->
  <g class="drift" fill="#F0D48A">
    <circle class="tw1" cx="320" cy="58"  r="1.4"/>
    <circle class="tw2" cx="452" cy="160" r="1.1"/>
    <circle class="tw3" cx="548" cy="248" r="1.3"/>
    <circle class="tw1" cx="590" cy="76"  r="1.0"/>
  </g>
  <g class="drift2" fill="#E9C46A">
    <circle class="tw3" cx="522" cy="140" r="1.1"/>
    <circle class="tw1" cx="420" cy="94"  r="1.0"/>
    <path class="tw2" d="M498 216 l2.6 5.4 5.4 2.6 -5.4 2.6 -2.6 5.4 -2.6 -5.4 -5.4 -2.6 5.4 -2.6z"/>
    <path class="tw3" d="M214 96 l2 4.2 4.2 2 -4.2 2 -2 4.2 -2 -4.2 -4.2 -2 4.2 -2z" fill="#F5EDD8"/>
  </g>

  <!-- shooting star -->
  <g class="shoot">
    <rect x="-70" y="44" width="70" height="1.6" fill="url(#tail)" transform="rotate(6 0 44)"/>
    <circle cx="0" cy="44" r="2" fill="#F5EDD8"/>
  </g>

  <!-- header row -->
  <text x="36" y="48" class="mono" fill="#E9C46A" font-size="12" letter-spacing="3">// TRANSMISSION FROM THE ORION ARM</text>
  <circle cx="694" cy="44" r="3.5" fill="#E9C46A" class="pulse"/>
  <text x="706" y="48" class="mono" font-size="12" letter-spacing="1.5" fill="#E9C46A">STATUS: ONLINE</text>

  <!-- name block · serif, like her site -->
  <text x="34" y="124" class="serif" font-size="52" letter-spacing="1" fill="#F5EDD8">Nur Amirah</text>
  <text x="34" y="180" class="serif" font-size="52" letter-spacing="1" fill="#F5EDD8">Mohd Kamil <tspan font-style="italic" fill="#E9C46A">(Mia)</tspan></text>

  <circle cx="41" cy="207" r="4" fill="#E9C46A" class="pulse"/>
  <text x="54" y="212" class="mono" font-size="14" letter-spacing="2" fill="#F5EDD8">AI SYSTEMS ENGINEER &#183; VIBE CODER</text>

  <line x1="36" y1="226" x2="486" y2="226" stroke="#3A3220" stroke-width="1.5"/>
  <text x="36" y="248" class="mono" font-size="12" letter-spacing="1.5" fill="#9A9182">FOUNDER &amp; CEO &#8212; MI4 INC. &#183; KUALA LUMPUR, MALAYSIA</text>

  <!-- rank chips -->
  <g class="mono" font-size="11" letter-spacing="1">
    <rect x="36" y="260" width="212" height="24" rx="12" fill="none" stroke="#E9C46A" stroke-opacity="0.75"/>
    <text x="142" y="276" text-anchor="middle" fill="#E9C46A">AI VISIONARY &#183; 98/100 &#183; L6</text>
    <rect x="258" y="260" width="150" height="24" rx="12" fill="none" stroke="#C9932F" stroke-opacity="0.85"/>
    <text x="333" y="276" text-anchor="middle" fill="#D9AE55">TOP 5 KRACKEDDEVS</text>
  </g>

  <!-- ORION · gold star chart, first-magnitude accurate -->
  <g stroke="#6B5A2E" stroke-width="1">
    <line x1="688" y1="66"  x2="636" y2="102"/>
    <line x1="688" y1="66"  x2="744" y2="96"/>
    <line x1="636" y1="102" x2="664" y2="158"/>
    <line x1="744" y1="96"  x2="708" y2="144"/>
    <line x1="664" y1="158" x2="686" y2="151"/>
    <line x1="686" y1="151" x2="708" y2="144"/>
    <line x1="664" y1="158" x2="648" y2="220"/>
    <line x1="708" y1="144" x2="752" y2="224"/>
  </g>
  <!-- soft halos, like the vertex glow on her site -->
  <g fill="#F0D48A" opacity="0.22">
    <circle cx="688" cy="66"  r="5"/><circle cx="744" cy="96" r="6.4"/>
    <circle cx="664" cy="158" r="6"/><circle cx="686" cy="151" r="6"/>
    <circle cx="708" cy="144" r="6"/><circle cx="648" cy="220" r="5.6"/>
  </g>
  <g fill="#F0D48A">
    <circle class="tw2" cx="688" cy="66"  r="2.2"/>
    <circle class="tw1" cx="636" cy="102" r="4.5" fill="#FF9E6B"/>
    <circle class="tw3" cx="744" cy="96"  r="3"/>
    <circle class="tw1" cx="664" cy="158" r="2.8"/>
    <circle class="tw2" cx="686" cy="151" r="2.8"/>
    <circle class="tw3" cx="708" cy="144" r="2.8"/>
    <circle class="tw2" cx="648" cy="220" r="2.6"/>
  </g>
  <text x="620" y="88" class="mono" font-size="10" letter-spacing="1.5" fill="#9A9182">&#945; BETELGEUSE</text>

  <!-- RIGEL · the one blue star in a gold sky -->
  <circle cx="752" cy="224" r="28" fill="url(#rigelGlow)" class="pulse"/>
  <g class="pulse">
    <line x1="752" y1="202" x2="752" y2="246" stroke="#A6C8FF" stroke-width="1"/>
    <line x1="730" y1="224" x2="774" y2="224" stroke="#A6C8FF" stroke-width="1"/>
  </g>
  <circle cx="752" cy="224" r="6" fill="#A6C8FF"/>
  <circle cx="752" cy="224" r="6" fill="none" stroke="#F5EDD8" stroke-opacity="0.7"/>
  <text x="812" y="272" text-anchor="end" class="mono" font-size="11.5" letter-spacing="1.5" fill="#A6C8FF">&#946; ORI &#183; RIGEL &#183; B8Ia &#183; 850 LY</text>

  <!-- footer caption · readable this time -->
  <text x="812" y="294" text-anchor="end" class="mono" fill="#9A9182" font-size="11" letter-spacing="1.5">STAR CHART: ORION &#8212; FIRST-MAGNITUDE ACCURATE</text>
</svg>
